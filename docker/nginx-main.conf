# Main nginx config for the runtime image. Paths that nginx writes to live in /tmp so the
# container also runs as a non-root user or with a read-only root filesystem (mount /tmp).
load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

# Workers only see the environment variables listed here; /config.js reads them at request time.
env SUPABASE_URL;
env SUPABASE_PUBLISHABLE_KEY;
env VITE_SUPABASE_URL;
env VITE_SUPABASE_PUBLISHABLE_KEY;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    js_import runtime_config from /etc/nginx/njs/runtime-config.js;

    include /etc/nginx/conf.d/*.conf;
}
